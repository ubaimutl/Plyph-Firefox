<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plyph history</title><link rel="stylesheet" href="ui.css"></head>
<body class="options history-page"><div class="settings-shell">
  <header class="settings-header history-page-header"><div><h1>History</h1><p>Recent results are stored locally on this device. Clear or disable them at any time.</p></div>
  <div class="history-header-actions">
    <label class="history-toggle"><input id="history-enabled" type="checkbox"><span><strong>Save history</strong><small>Store new results locally</small></span></label>
    <button id="clear" class="secondary danger">Clear all</button>
    <button id="open-settings" class="secondary">Settings</button>
  </div></header>
  <div class="history-content"><main class="settings-main"><section class="page active" id="history-page"><div id="history-list" class="history-list"></div></section></main></div>
</div><script type="module" src="history.js"></script></body></html>
